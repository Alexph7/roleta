<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roleta Premiada</title>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <main class="app">

        <section id="tela-acesso" class="tela">

            <img class="menu-logo" src="logo-centro.png" alt="Paradoxo" draggable="false">

            <p id="status-acesso">
                Carregando...
            </p>

        </section>

        <!-- ========================= -->
        <!-- MENU PRINCIPAL -->
        <!-- ========================= -->

        <section id="tela-menu" class="tela" hidden>

            <div class="menu-topo">

                <img class="menu-logo" src="logo-centro.png" alt="Paradoxo" draggable=" false">

                <p class="subtitulo-menu">
                    Jogue, participe e divirta-se.
                </p>

            </div>


            <div class="grade-jogos">

                <!-- 1 - ROLETA -->
                <button id="abrir-roleta" class="card-jogo" type="button">

                    <div class="card-jogo-icone">
                        🎡
                    </div>

                    <div class="card-jogo-conteudo">

                        <strong>
                            Roleta Premiada
                        </strong>

                        <span>
                            Tente a sorte e concorra a prêmios
                        </span>

                        <small id="status-roleta-menu">
                            Carregando...
                        </small>

                    </div>

                </button>


                <button id="abrir-pontos" class="card-jogo" type="button">
                    <div class="card-jogo-icone">
                        🏆
                    </div>

                    <div class="card-jogo-conteudo">

                        <strong>
                            Roleta de Pontos
                        </strong>

                    </div>
                </button>

                <!-- 3 - SURPRESA -->
                <div class="card-jogo card-bloqueado">

                    <div class="card-jogo-icone">
                        🎁
                    </div>

                    <div class="card-jogo-conteudo">

                        <strong>
                            Surpresa
                        </strong>

                        <small>
                            EM BREVE
                        </small>

                    </div>

                </div>

                <!-- 4 - VAZIO -->
                <div class="card-jogo card-vazio"></div>


                <!-- 5 - VAZIO -->
                <div class="card-jogo card-vazio"></div>


                <!-- 6 - VAZIO -->
                <div class="card-jogo card-vazio"></div>

            </div>

        </section>


        <!-- ========================= -->
        <!-- ROLETA DE PONTOS -->
        <!-- ========================= -->

        <section id="tela-pontos" class="tela" hidden>

            <button id="voltar-menu-pontos" class="voltar-menu" type="button">
                ← MENU
            </button>

            <h1>
                🏆 Roleta de Pontos
            </h1>

            <p class="subtitulo-pontos">
                Giro diário
            </p>

            <div class="placar-pontos">
                <span>
                    SEUS PONTOS
                </span>

                <strong id="total-pontos">
                    0 pts
                </strong>
            </div>

            <div class="roleta-pontos-area">

                <div class="ponteiro-pontos"></div>

                <canvas id="roleta-pontos" width="600" height="600"></canvas>

            </div>

            <button id="girar-pontos" type="button" disabled>
                GIRO EM PREPARAÇÃO
            </button>

            <p id="resultado-pontos" class="resultado-pontos"></p>

        </section>

        <!-- ========================= -->
        <!-- ROLETA -->
        <!-- ========================= -->

        <section id="tela-roleta" class="tela" hidden>

            <button id="voltar-menu" class="voltar-menu" type="button">
                ← MENU
            </button>


            <h1>
                🎁 Roleta Premiada
            </h1>

            <p class="subtitulo">
                Toque no botão para girar
            </p>


            <div class="roleta-area">

                <div class="ponteiro"></div>

                <img class="moldura-roleta" src="roleta-premium.png" alt="Roleta Premiada">

                <div class="disco-wrap">

                    <canvas id="roleta" width="600" height="600"></canvas>

                </div>

            </div>


            <button id="girar">
                🎡 GIRAR
            </button>


            <div id="aviso-comunidade" class="aviso-comunidade" hidden>

                <p>
                    🔒 Para participar, você precisa
                    estar inscrito nos canais abaixo:
                </p>

                <div id="canais-faltando"></div>

                <button id="verificar-inscricao" type="button">
                    ✅ JÁ ME INSCREVI — VERIFICAR
                </button>

            </div>


            <p id="resultado" class="resultado"></p>

        </section>

    </main>

    <script src="app.js?v=4"></script>

</body>

</html>
